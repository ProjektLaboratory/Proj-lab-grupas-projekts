<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpa - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F9F9FF;
            color: #896E69;
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            flex-direction: column;
        }
        
        .header {
            background-color: #F9F9FF;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 10;
            width: 100%;
        }
        
        .company-name {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #8C0004 0%, #b63b44db 50%, #FFA577 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info a {
            color: #8C0004;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(142, 0, 4, 0.1);
        }
        
        .user-info a:hover {
            background: rgba(142, 0, 4, 0.2);
            transform: translateY(-2px);
        }
        
        .floating-element {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 165, 119, 0.1);
            z-index: -1;
        }
        
        .floating-1 {
            width: 200px;
            height: 200px;
            top: 10%;
            right: 5%;
        }
        
        .floating-2 {
            width: 150px;
            height: 150px;
            bottom: 15%;
            left: 5%;
            background: rgba(142, 0, 4, 0.1);
        }
        
        .content {
            padding: 40px;
            flex-grow: 1;
            background-color: #F9F9FF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
        }
        
        .login-container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #8C0004 0%, #b63b44db 50%, #FFA577 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .page-subtitle {
            color: #896E69;
            font-size: 16px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .login-card {
            background-color: rgb(255, 255, 255);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid rgb(255, 255, 255);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFA577 0%, #b63b44db 50%, #8C0004 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 36px;
        }
        
        .login-card h5 {
            color: #b63b44db;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            position: relative;
            padding-left: 15px;
        }
        
        .login-card h5::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(135deg, #FFA577 0%, #b63b44db 50%, #8C0004 100%);
            border-radius: 2px;
        }
        
        .form-label {
            color: #896E69;
            font-weight: 500;
        }
        
        .form-control {
            border: 1px solid rgba(140, 0, 4, 0.2);
            border-radius: 8px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #8C0004;
            box-shadow: 0 0 0 0.2rem rgba(140, 0, 4, 0.15);
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #FFA577 0%, #b63b44db 50%, #8C0004 100%);
            border: none;
            color: white;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .btn-gradient:hover::before {
            left: 100%;
        }
        
        .btn-gradient:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(142, 0, 4, 0.4);
        }
        
        .btn-outline-gradient {
            border: 2px solid #8C0004;
            color: #8C0004;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
            position: relative;
            overflow: hidden;
        }
        
        .btn-outline-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(140, 0, 4, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .btn-outline-gradient:hover::before {
            left: 100%;
        }
        
        .btn-outline-gradient:hover {
            background: linear-gradient(135deg, #FFA577 0%, #b63b44db 50%, #8C0004 100%);
            border-color: #8C0004;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(142, 0, 4, 0.3);
        }
        
        .login-link {
            color: #8C0004;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .login-link:hover {
            color: #6d0003;
            text-decoration: underline;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #896E69;
            cursor: pointer;
            font-size: 16px;
        }
        
        .password-container {
            position: relative;
        }
        
        .toast-success {
            background: linear-gradient(135deg, #8C0004 0%, #b63b44db 100%);
            color: white;
            border: none;
            border-radius: 8px;
        }
        
        .toast-error {
            background: linear-gradient(135deg, #FFA577 0%, #b63b44db 100%);
            color: white;
            border: none;
            border-radius: 8px;
        }
        
        .social-login {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(140, 0, 4, 0.1);
        }
        
        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: 1px solid rgba(140, 0, 4, 0.2);
            color: #896E69;
            font-size: 18px;
            margin: 0 5px;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            background: linear-gradient(135deg, #FFA577 0%, #b63b44db 50%, #8C0004 100%);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(142, 0, 4, 0.3);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .form-check-input:checked {
            background-color: #8C0004;
            border-color: #8C0004;
        }
        
        .form-check-input:focus {
            border-color: #8C0004;
            box-shadow: 0 0 0 0.2rem rgba(140, 0, 4, 0.25);
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
                flex-wrap: wrap;
            }
            
            .company-name {
                order: 1;
                width: 100%;
                text-align: center;
                margin: 10px 0;
            }
            
            .user-info {
                order: 2;
                margin: 0 auto;
            }
            
            .content {
                padding: 20px;
            }
            
            .login-card {
                padding: 25px;
            }
            
            .page-title {
                font-size: 28px;
            }
            
            .login-card h5 {
                font-size: 22px;
            }
            
            .login-icon {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }
        }
        
        @media (max-width: 576px) {
            .header {
                padding: 12px 15px;
            }
            
            .content {
                padding: 15px;
            }
            
            .login-card {
                padding: 20px;
            }
            
            .btn-gradient, .btn-outline-gradient {
                padding: 10px 18px;
                font-size: 14px;
            }
            
            .page-title {
                font-size: 24px;
            }
            
            .login-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            
            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="floating-element floating-1"></div>
    <div class="floating-element floating-2"></div>

    <div class="header">
        <div class="company-name">Limpa</div>

        <div class="user-info">
            <a href="register.html" class="btn-outline-gradient">
                <i class="fas fa-user-plus me-1"></i> Register
            </a>
        </div>
    </div>

    <div class="content">
        <div class="login-container">
            <h1 class="page-title">Welcome Back</h1>
            <p class="page-subtitle">Sign in to your Limpa account to access your recipes and favourites.</p>
            
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="login-card">
                        <div class="login-header">
                            <div class="login-icon">
                                <i class="fas fa-sign-in-alt"></i>
                            </div>
                            <h5>Login to Your Account</h5>
                            <p class="text-muted">Enter your credentials to access your Limpa account</p>
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="password-container">
                                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                                    <button type="button" class="password-toggle" id="togglePassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="remember-forgot">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="login-link">Forgot Password?</a>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn-gradient">
                                    <i class="fas fa-sign-in-alt me-2"></i> Sign In
                                </button>
                                <button type="button" class="btn-outline-gradient" onclick="resetForm()">
                                    <i class="fas fa-redo me-2"></i> Clear Form
                                </button>
                            </div>
                            
                            <div class="social-login">
                                <p class="text-muted mb-3">Or sign in with</p>
                                <div>
                                    <button type="button" class="social-btn" onclick="demoLogin('user')">
                                        <i class="fas fa-user"></i>
                                    </button>
                                    <button type="button" class="social-btn" onclick="demoLogin('google')">
                                        <i class="fab fa-google"></i>
                                    </button>
                                    <button type="button" class="social-btn" onclick="demoLogin('facebook')">
                                        <i class="fab fa-facebook-f"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="text-center mt-4">
                                <p class="mb-0">Don't have an account? <a href="register.html" class="login-link">Create Account</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="successToast" class="toast align-items-center toast-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Login successful!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="errorToast" class="toast align-items-center toast-error border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="errorMessage">Invalid email or password!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const PROFILE_KEY = 'limpa_profile_v1';
        const USERS_KEY = 'limpa_users_v1';
        const CURRENT_USER_KEY = 'current_user';
        const FAVOURITES_KEY = 'limpa_favourites_v1';

        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const loginForm = document.getElementById('loginForm');
            
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePasswordBtn.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });
            
            loginForm.addEventListener('submit', loginUser);
            
            const currentUser = JSON.parse(localStorage.getItem(CURRENT_USER_KEY));
            if (currentUser) {
                window.location.href = 'home.html';
            }
            
            if (!localStorage.getItem(FAVOURITES_KEY)) {
                localStorage.setItem(FAVOURITES_KEY, JSON.stringify({}));
            }
        });
        
        function loginUser(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
            const user = users.find(u => u.email === email);
            
            if (!user) {
                showError('No account found with this email address.');
                return;
            }
            
            const userData = {
                id: user.id,
                firstName: user.firstName,
                lastName: user.lastName,
                email: user.email,
                preferences: user.preferences || [],
                newsletter: user.newsletter || false,
                joinDate: user.joinDate
            };
            
            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(userData));
            
            const profile = {
                name: `${user.firstName} ${user.lastName}`,
                email: user.email,
                bio: '',
                preferences: user.preferences || [],
                joinDate: user.joinDate || new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
            };
            
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
            
            if (remember) {
                localStorage.setItem('remember_login', 'true');
            }
            
            const toastElement = document.getElementById('successToast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = `Welcome back, ${user.firstName}!`;
            
            const toast = new bootstrap.Toast(toastElement);
            toast.show();
            
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 2000);
        }
        
        function demoLogin(type) {
            let demoEmail, demoName;
            
            switch(type) {
                case 'user':
                    demoEmail = 'demo@limpa.com';
                    demoName = 'Demo User';
                    break;
                case 'google':
                    demoEmail = 'google.user@limpa.com';
                    demoName = 'Google User';
                    break;
                case 'facebook':
                    demoEmail = 'facebook.user@limpa.com';
                    demoName = 'Facebook User';
                    break;
            }
            
            const demoUser = {
                id: 'demo_' + Date.now().toString(),
                firstName: demoName.split(' ')[0],
                lastName: demoName.split(' ')[1] || 'User',
                email: demoEmail,
                preferences: [],
                newsletter: false,
                joinDate: new Date().toISOString()
            };
            
            const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
            const existingUser = users.find(u => u.email === demoEmail);
            
            if (!existingUser) {
                users.push(demoUser);
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            }
            
            const userToLogin = existingUser || demoUser;
            
            const userData = {
                id: userToLogin.id,
                firstName: userToLogin.firstName,
                lastName: userToLogin.lastName,
                email: userToLogin.email,
                preferences: userToLogin.preferences || [],
                newsletter: userToLogin.newsletter || false,
                joinDate: userToLogin.joinDate
            };
            
            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(userData));
            
            const profile = {
                name: `${userToLogin.firstName} ${userToLogin.lastName}`,
                email: userToLogin.email,
                bio: '',
                preferences: userToLogin.preferences || [],
                joinDate: userToLogin.joinDate || new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
            };
            
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
            
            document.getElementById('email').value = demoEmail;
            document.getElementById('password').value = 'demopassword123';
            
            const toastElement = document.getElementById('successToast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = `Demo login as ${userToLogin.firstName}! Redirecting...`;
            
            const toast = new bootstrap.Toast(toastElement);
            toast.show();
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
        
        function resetForm() {
            document.getElementById('loginForm').reset();
        }
        
        function showError(message) {
            const errorElement = document.getElementById('errorToast');
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            
            const errorToast = new bootstrap.Toast(errorElement);
            errorToast.show();
        }
    </script>
</body>
</html>
